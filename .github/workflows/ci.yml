name: Quality
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fiscalflow_demo
          POSTGRES_PASSWORD: local_demo_only
          POSTGRES_DB: fiscalflow
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend tests scripts
      - run: pytest -q
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend
      - name: PostgreSQL migration and demo smoke
        env:
          DATABASE_URL: postgresql+psycopg://fiscalflow_demo:local_demo_only@localhost:5432/fiscalflow
        run: |
          alembic -c backend/alembic.ini upgrade head
          python scripts/generate_data.py
          uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          npm run dev --prefix frontend > frontend.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 2; done
          cd frontend
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-and-test-results
          path: |
            docs/screenshots
            frontend/test-results
